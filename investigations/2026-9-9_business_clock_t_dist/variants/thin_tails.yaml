name: thin_tails
base_params: model.json@fv-1.0.0
overrides: {kappa_tail: 0.5}
notes: >
  The other side of fat_tails. The shipped tails are already fitted, so both
  should lose; if one wins, the tail fit is biased in that direction on the 5 m
  window, which is a different sample from the one it was fitted on. Same
  caution as fat_tails: the floor nu' = max(2 + (nu-2)*exp(kappa_tail), 2.5)
  already pins 3 of the 9 chainlink_twap60 z-bins at 2.5, so this knob cannot
  thin the tail below what is already floored at the shortest horizons.
