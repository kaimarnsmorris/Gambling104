name: no_alpha
base_params: model.json@fv-1.0.0
overrides: {alpha_scale: 0.0}
notes: >
  The order-book location term off. Should move m_Y to exactly zero and barely
  move pooled log-loss; if it moves it a lot, the alpha is doing more than the
  0.18 bp per unit of imbalance it was fitted at, which would be suspicious
  given the book captures do not overlap the Chainlink history.

  CURRENTLY INERT on the real-panel export, for a reason stronger than the
  paragraph above anticipated: export/build_export.py calls
  evaluate(..., book=None), so m_Y is already zero in BASELINE on this panel,
  not just after this override. m_Y going to "exactly zero" here confirms
  nothing was on to begin with, not that alpha's effect is negligible.
